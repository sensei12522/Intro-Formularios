<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Héroes</title>
</head>
<body>

    <header>
        <h1>Academia de Héroes</h1>
        <p>Formulario de inscripción para nuevos aspirantes</p>
    </header>

    <main>

        <form>

            <fieldset>

                <legend>Información Personal</legend>

                <div>
                    <label for="nombre">Nombre Completo:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="alias">Alias de Héroe:</label>
                    <input
                        type="text"
                        id="alias"
                        name="alias"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="correo">Correo Electrónico:</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="fechaNacimiento">
                        Fecha de Nacimiento:
                    </label>

                    <input
                        type="date"
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                    >
                </div>

            </fieldset>

            <br>

            <fieldset>

                <legend>Información del Héroe</legend>

                <div>
                    <label for="poder">
                        Poder Principal:
                    </label>

                    <select id="poder" name="poder">

                        <option value="">
                            Seleccione una opción
                        </option>

                        <option value="fuego">
                            Fuego
                        </option>

                        <option value="hielo">
                            Hielo
                        </option>

                        <option value="electricidad">
                            Electricidad
                        </option>

                        <option value="telepatia">
                            Telepatía
                        </option>

                    </select>
                </div>

                <br>

                <p>Nivel de Experiencia:</p>

                <input
                    type="radio"
                    id="principiante"
                    name="nivel"
                    value="principiante"
                >

                <label for="principiante">
                    Principiante
                </label>

                <br>

                <input
                    type="radio"
                    id="intermedio"
                    name="nivel"
                    value="intermedio"
                >

                <label for="intermedio">
                    Intermedio
                </label>

                <br>

                <input
                    type="radio"
                    id="avanzado"
                    name="nivel"
                    value="avanzado"
                >

                <label for="avanzado">
                    Avanzado
                </label>

                <br><br>

                <p>Habilidades Especiales:</p>

                <input
                    type="checkbox"
                    id="vuelo"
                    name="habilidades"
                    value="vuelo"
                >

                <label for="vuelo">
                    Vuelo
                </label>

                <br>

                <input
                    type="checkbox"
                    id="fuerza"
                    name="habilidades"
                    value="fuerza"
                >

                <label for="fuerza">
                    Super Fuerza
                </label>

                <br>

                <input
                    type="checkbox"
                    id="invisibilidad"
                    name="habilidades"
                    value="invisibilidad"
                >

                <label for="invisibilidad">
                    Invisibilidad
                </label>

                <br>

                <input
                    type="checkbox"
                    id="curacion"
                    name="habilidades"
                    value="curacion"
                >

                <label for="curacion">
                    Curación
                </label>

            </fieldset>

            <br>

            <fieldset>

                <legend>Historia del Héroe</legend>

                <div>

                    <label for="historia">
                        Cuéntanos tu historia:
                    </label>

                    <br><br>

                    <textarea
                        id="historia"
                        name="historia"
                        rows="6"
                        cols="50"
                    ></textarea>

                </div>

                <br>

                <div>

                    <label for="motivacion">
                        Motivación para ser héroe:
                    </label>

                    <br><br>

                    <textarea
                        id="motivacion"
                        name="motivacion"
                        rows="4"
                        cols="50"
                    ></textarea>

                </div>

            </fieldset>

            <br>

            <fieldset>

                <legend>Fotografía</legend>

                <label for="foto">
                    Foto del Héroe:
                </label>

                <input
                    type="file"
                    id="foto"
                    name="foto"
                >

            </fieldset>

            <br>

            <fieldset>

                <legend>Confirmación</legend>

                <input
                    type="checkbox"
                    id="acepto"
                    name="acepto"
                    required
                >

                <label for="acepto">
                    Acepto las normas de la Academia de Héroes
                </label>

            </fieldset>

            <br>

            <button type="submit">
                Registrar Héroe
            </button>

            <button type="reset">
                Limpiar Formulario
            </button>

        </form>

    </main>

</body>
</html>
